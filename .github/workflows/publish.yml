name: publish

# Publishes the npm package and the MCP Registry entry from one tag.
#
# Both hops authenticate off the SAME OIDC token and no long-lived secret
# exists in this repository. The registry's own sample workflow publishes npm
# with an NPM_TOKEN; that part is deliberately not copied. npm trusted
# publishing removes the token entirely and attaches a provenance attestation by
# default, which matters more here than usual - this package is a thing a
# stranger lets run on their machine holding their API key, and `postmark-mcp`
# is the precedent for why that attestation is worth having.
#
# PREREQUISITES, none of which this workflow can create:
#   1. The npm org `cogdepot` exists and the package name is claimed.
#   2. npm trusted publishing is configured for cogdepot/mcp-server with THIS
#      filename. Renaming this file silently breaks publishing until the npm
#      side is updated to match.
#   3. The repository is public, so Glama and PulseMCP can index it.

on:
  push:
    tags: ["v*"]
  # Re-run a publish for a tag that is already cut. deploy.yml has had this
  # since 08-27 and publish.yml did not, which cost 0.8.0 its registry entry:
  # verify:published failed on a propagation race three seconds after a correct
  # npm publish, the registry steps skipped, and there was no way back. Re-running
  # the job replays `npm publish`, which npm refuses for a version it already
  # serves, so every retry failed earlier than the one that mattered.
  #
  # Run it FROM THE TAG, not from a branch. Every step reads the version out of
  # GITHUB_REF, and the guard below refuses a ref that is not a v* tag rather
  # than publishing something mislabelled - publish.yml has no environment to
  # refuse it the way deploy.yml's does.
  workflow_dispatch:

permissions:
  id-token: write # OIDC, for npm trusted publishing AND mcp-publisher
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Ensure npm can do trusted publishing
        # Trusted publishing needs npm >= 11.5.1. Node 22 bundles 10.9.2, which
        # does NOT support it - and the failure mode is quiet: npm falls back to
        # wanting a token and the publish fails on auth, pointing at credentials
        # rather than at the version. Upgrade explicitly and assert it.
        run: |
          set -euo pipefail
          npm install -g npm@latest
          VERSION=$(npm --version)
          echo "npm $VERSION"
          node -e "
            const [maj, min, patch] = process.argv[1].split('.').map(Number);
            const ok = maj > 11 || (maj === 11 && (min > 5 || (min === 5 && patch >= 1)));
            if (!ok) { console.error('npm ' + process.argv[1] + ' is below 11.5.1'); process.exit(1); }
          " "$VERSION"

      - run: npm ci
      - run: npm run typecheck
      - run: npm run coverage
      - run: npm run build

      - name: Smoke the built artefact before it is published
        run: node scripts/smoke.mjs

      - name: Drift - the API and the bundled snapshot must still agree
        # This also runs in verify.yml, but not on this path. The release
        # workflow tags immediately after merging, so publish can start while
        # the main-branch verify is still running - meaning a stale fallback
        # snapshot or an uncovered endpoint could reach npm with the guard
        # green somewhere else. Both checks read the LIVE API, so the only
        # useful moment to run them is immediately before publishing.
        run: npm run drift

      - name: The production API must understand what this package sends
        # Hard gate, and the only one here that looks at PRODUCTION rather than
        # at this repository. DEFAULT_API_BASE_URL is https://api.cogdepot.com,
        # so whatever is published points at production by default. cogDepot
        # ignores unknown JSON fields, which makes the mismatch silent in the
        # worst direction: a tool sending a field the deployment does not know
        # gets a 204 and tells the operator their declaration was saved when
        # nothing was stored.
        #
        # A staging run cannot answer this, and verify:route cannot either -
        # that one writes, so it refuses production by design. This reads
        # /openapi.json and nothing else, which is why it can run here.
        #
        # Fails closed on BOTH outcomes, unlike the same check run by hand:
        # exit 1 is not-deployed, exit 2 is could-not-check, and neither is a
        # basis for an irreversible publish. npm allows no free unpublish, so a
        # release made on an unproven assumption is a deprecation notice
        # forever - which is what 0.1.0 through 0.1.2 already are.
        #
        # Once production is ahead of the package this passes silently. It
        # stays useful anyway: a production rollback would trip it again.
        run: npm run route-ready:prod

      - name: The ref must be a v* tag
        # workflow_dispatch accepts any ref. Everything downstream derives the
        # version by stripping refs/tags/v off GITHUB_REF, so a branch run would
        # carry "refs/heads/main" as its version into the checks below and only
        # fail once it reached npm. Refuse it here, where the message says why.
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/tags/v*) echo "ref: $GITHUB_REF" ;;
            *) echo "::error::$GITHUB_REF is not a v* tag. Dispatch this workflow from the release tag."; exit 1 ;;
          esac

      - name: Version must match the tag in all three places
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          SRV_VERSION=$(node -p "require('./server.json').version")
          PKG_INNER=$(node -p "require('./server.json').packages[0].version")
          MCP_NAME=$(node -p "require('./package.json').mcpName")
          SRV_NAME=$(node -p "require('./server.json').name")

          echo "tag=$TAG_VERSION package.json=$PKG_VERSION server.json=$SRV_VERSION packages[0]=$PKG_INNER"

          [ "$TAG_VERSION" = "$PKG_VERSION" ] || { echo "::error::package.json version does not match the tag"; exit 1; }
          [ "$TAG_VERSION" = "$SRV_VERSION" ] || { echo "::error::server.json version does not match the tag"; exit 1; }
          [ "$TAG_VERSION" = "$PKG_INNER" ] || { echo "::error::server.json packages[0].version does not match the tag"; exit 1; }
          # A mismatch here is a hard publish blocker at the registry, and it
          # fails there with a message that does not name the cause.
          [ "$MCP_NAME" = "$SRV_NAME" ] || { echo "::error::package.json mcpName ($MCP_NAME) != server.json name ($SRV_NAME)"; exit 1; }

      - name: Publish to npm
        # No NODE_AUTH_TOKEN. Trusted publishing supplies the credential from
        # the OIDC token above, and provenance is attached by default.
        #
        # Skipped when npm already serves this version, which is what makes a
        # re-run useful. npm refuses to republish a version and allows no free
        # unpublish, so without this guard the only failure mode of a re-run is
        # the step that already succeeded, and the steps that did NOT run - the
        # registry publish - stay unreachable forever. Skipping is safe because
        # the very next step re-verifies the artefact npm actually serves; it
        # does not take "already published" on trust.
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF#refs/tags/v}"
          if npm view "@cogdepot/mcp-server@$VERSION" version >/dev/null 2>&1; then
            echo "npm already serves $VERSION. Skipping publish; the next step still verifies it."
            exit 0
          fi
          npm publish --access public

      - name: The published package must advertise what was built
        # Everything before this tested the SOURCE. This installs the tarball
        # npm now serves, by name and version, the way a stranger's client
        # does, and asks it what it advertises.
        #
        # A publish can succeed and still ship the wrong thing: a stale dist/
        # in the tarball, a files list that omits a module, a build that
        # emitted the previous commit's output. `npm publish` reports that an
        # upload happened, not that the upload was correct.
        #
        # It runs AFTER the publish because it can only inspect something that
        # exists, so it cannot prevent a bad release - it can only make one
        # loud instead of silent. npm allows no free unpublish, so the remedy
        # is always a follow-up version. Finding out here beats finding out
        # from a user, which is the neighbouring failure this repository
        # already had: the hosted server served 0.3.0 for six days while npm
        # served 0.4.0, and nothing was watching.
        #
        # Before the registry publish deliberately. A tarball that does not do
        # what it claims should not also be advertised to every MCP client.
        run: npm run verify:published -- "${GITHUB_REF#refs/tags/v}"
      - name: Install mcp-publisher
        # Pinned, not `latest`: a publisher release must not be able to change
        # what a tagged release does.
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
        run: |
          set -euo pipefail
          curl -fL "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to the MCP Registry
        # github-oidc, not github: the latter is the interactive device-code flow.
        #
        # Retried because registry.modelcontextprotocol.io is intermittently
        # unresolvable. Measured on 2026-09-03 from the cogDepot side: a drift
        # check against it needed three attempts, twice reporting the host
        # unreachable, while npm resolved fine in the same pass.
        #
        # Everything from here on runs AFTER npm publish, which cannot be
        # replayed. A DNS blip in this step would strand a version on npm with
        # no registry entry - the same outcome 0.8.0 had from a different cause.
        # workflow_dispatch makes that recoverable now, but a coin flip should
        # not turn a release into a manual recovery.
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            if ./mcp-publisher login github-oidc; then exit 0; fi
            [ "$attempt" = 3 ] && break
            echo "login attempt $attempt failed; retrying in ${attempt}0s"
            sleep "${attempt}0"
          done
          echo "::error::could not authenticate to the MCP Registry after 3 attempts"
          exit 1

      - name: Publish to the MCP Registry
        # Same retry, plus one thing login does not need: a publish that reached
        # the registry and then lost its response looks identical to one that
        # never arrived, and blindly retrying that would fail on "version
        # already exists" - turning a transient into a hard failure after npm
        # has already published. So each failure asks the registry which case it
        # was before retrying. Same shape as the npm publish guard above: verify
        # the end state rather than trusting the attempt.
        run: |
          set -uo pipefail
          VERSION="${GITHUB_REF#refs/tags/v}"
          NAME=$(node -p "require('./server.json').name")
          for attempt in 1 2 3; do
            if ./mcp-publisher publish; then
              echo "published on attempt $attempt"
              exit 0
            fi
            if curl -sf --max-time 30 \
                 "https://registry.modelcontextprotocol.io/v0/servers?search=${NAME}&version=latest" \
                 | grep -q "\"version\":\"${VERSION}\""; then
              echo "the registry already serves ${VERSION}; attempt $attempt reached it after all"
              exit 0
            fi
            [ "$attempt" = 3 ] && break
            echo "publish attempt $attempt failed and ${VERSION} is not live; retrying in ${attempt}0s"
            sleep "${attempt}0"
          done
          echo "::error::the MCP Registry publish did not succeed after 3 attempts"
          exit 1

      - name: Remind that propagation is not proven by a successful publish
        run: |
          echo "::notice::Published. Now VERIFY listings by looking at Smithery, Glama and PulseMCP."
          echo "::notice::An earlier release was blocked precisely because 'it lists automatically' was believed rather than checked."
