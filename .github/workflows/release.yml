name: release

# Promotes develop to main as the bot rather than as a person, so the public
# release trail on a public repo reads cogdepot-bot[bot].
#
# Why a GitHub App and not the built-in GITHUB_TOKEN: pushes and tags made with
# GITHUB_TOKEN deliberately do not trigger other workflows, so a tag created
# that way would never fire the publish workflow. An App installation token has
# no such restriction.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to tag, without the leading v (e.g. 1.0.0). Leave blank to merge without tagging."
        required: false
        type: string

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Mint an installation token for the bot
        id: app
        uses: actions/create-github-app-token@v3
        with:
          # client-id, not app-id: v3 deprecates app-id. Both identify the same
          # App; the client id is the one the action wants now.
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}

      - name: Open and merge the promotion PR
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail

          # Ancestry, not SHA equality. `gh pr merge --merge` creates a merge
          # commit, so main is never the same SHA as develop even immediately
          # after a successful promotion, and the old equality check therefore
          # never fired. That broke this workflow's own documented "leave the
          # version blank to merge without tagging" path: the follow-up run
          # supplying the version found nothing to promote, `gh pr create`
          # exited non-zero with "No commits between", and `set -e` killed the
          # job before the tag step it was run for. Whether develop is already
          # contained in main is the question that was always meant.
          if git rev-parse --verify origin/main >/dev/null 2>&1 \
             && git merge-base --is-ancestor origin/develop origin/main; then
            echo "main already contains develop. Nothing to promote."
          else

            # Reuse an open promotion PR rather than stacking duplicates.
            PR=$(gh pr list --base main --head develop --state open --json number --jq '.[0].number // empty')
            if [ -z "$PR" ]; then
              # gh pr create has no --json flag; it prints the PR URL. Take the
              # number off the end rather than inventing a flag that does not exist.
              PR_URL=$(gh pr create --base main --head develop \
                         --title "release: promote develop to main" \
                         --body "Automated promotion. Merged by the release app so the public trail is not a personal account.")
              PR=${PR_URL##*/}
            fi
            echo "promotion PR: #$PR"

            # --merge, not --squash: squashing rewrites authorship onto the merger
            # and would put the bot's identity on every commit, defeating the
            # authorship check and losing the akashy attribution in history.
            gh pr merge "$PR" --merge --delete-branch=false
          fi

      - name: Tag the release
        if: inputs.version != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          git fetch origin main
          SHA=$(git rev-parse origin/main)
          gh api -X POST repos/${{ github.repository }}/git/refs \
            -f ref="refs/tags/v${{ inputs.version }}" -f sha="$SHA"
          echo "tagged v${{ inputs.version }} at $SHA"
