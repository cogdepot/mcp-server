name: verify-publishable

# This repository is public. The planning, costing and strategy documents for
# this work live in the PRIVATE cogdepot/cogDepot repository and must never
# appear here - they carry revenue targets, channel post-mortems, unreleased
# decisions and internal task ids.
#
# The risk is not malice, it is a careless copy: the plan document is the thing
# you read while writing this server, and it sits one directory away. A denylist
# in .gitignore stops the accident; this check stops the accident that used
# `git add -f`, or arrived through a branch made somewhere else.

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  no-internal-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Refuse internal planning documents by filename
        run: |
          set -euo pipefail
          PATTERN='(^|/)(mcp-server-plan|EXECUTION|PRD|TDD|COSTS|DESIGN|CHANGELOG-internal|LANDING_REDESIGN|VISION-REMEDIATION|chance-history|feedback-improvement-plan|x402-integration-plan|directory-submission[^/]*|[^/]*-submissions-log|marketing-[^/]*)\.md$'
          BAD=$(git ls-files | grep -iE "$PATTERN" || true)
          if [ -n "$BAD" ]; then
            echo "::error::Internal planning documents must not be committed to the public repository."
            echo "$BAD"
            echo ""
            echo "These live in the private cogdepot/cogDepot repository. If a public"
            echo "document genuinely needs one of these names, rename it rather than"
            echo "weakening this check."
            exit 1
          fi
          echo "OK - no internal planning documents by filename"

      - name: Refuse references to the private repository
        run: |
          set -euo pipefail
          # cogdepot/cogDepot is the private repo. io.github.cogdepot/cogdepot is
          # the MCP Registry namespace and is expected - the case-sensitive match
          # on the capital D is what separates them, so do NOT add -i here.
          HITS=$(git grep -n 'cogdepot/cogDepot' -- . || true)
          if [ -n "$HITS" ]; then
            echo "::error::Reference to the private repository found."
            echo "$HITS"
            exit 1
          fi
          echo "OK - no references to the private repository"
