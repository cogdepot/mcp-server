name: verify-publishable

# This repository is public. The planning, costing and strategy documents for
# this work live in a separate private repository and must never appear here -
# they carry revenue targets, channel post-mortems, unreleased decisions and
# internal task ids.
#
# The risk is not malice, it is a careless copy: the plan document is the thing
# you read while writing this server, and it sits one directory away. A denylist
# in .gitignore stops the accident before staging; this check stops the accident
# that used `git add -f`, or arrived on a branch made somewhere else.

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  no-internal-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Refuse internal planning documents by filename
        run: |
          set -euo pipefail
          PATTERN='(^|/)(mcp-server-plan|EXECUTION|PRD|TDD|COSTS|DESIGN|LANDING_REDESIGN|VISION-REMEDIATION|chance-history|feedback-improvement-plan|x402-integration-plan|directory-submission[^/]*|[^/]*-submissions-log|marketing-[^/]*)\.md$'
          BAD=$(git ls-files | grep -iE "$PATTERN" || true)
          if [ -n "$BAD" ]; then
            echo "::error::Internal planning documents must not be committed to the public repository."
            echo "$BAD"
            echo ""
            echo "These belong in the private planning repository. If a public document"
            echo "genuinely needs one of these names, rename it rather than weakening"
            echo "this check."
            exit 1
          fi
          echo "OK - no internal planning documents by filename"

      - name: Refuse references to the private repository
        run: |
          set -euo pipefail

          # The bracket around [D] is deliberate and load-bearing. The private
          # repository's path differs from this project's MCP Registry namespace
          # only by the capital D, so the match must stay case-sensitive - and
          # writing the path literally here would make this file match itself,
          # which is exactly how the first version of this check failed. The
          # bracket keeps the pattern from matching its own text without needing
          # a path exclusion, and an exclusion would be a hole to hide in.
          HITS=$(git grep -nE 'cogdepot/cog[D]epot' -- . || true)

          if [ -n "$HITS" ]; then
            echo "::error::Reference to the private repository found."
            echo "$HITS"
            exit 1
          fi
          echo "OK - no references to the private repository"
