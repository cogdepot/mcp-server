name: verify-publishable

# This repository is public. The planning, costing and strategy documents for
# this work live in a separate private repository and must never appear here -
# they carry revenue targets, channel post-mortems, unreleased decisions and
# internal task ids.
#
# The risk is not malice, it is a careless copy: the plan document is the thing
# you read while writing this server, and it sits one directory away. A denylist
# in .gitignore stops the accident before staging; this check stops the accident
# that used `git add -f`, or arrived on a branch made somewhere else.

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  no-internal-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Only known-public markdown may exist here
        run: |
          set -euo pipefail

          # An ALLOWLIST, deliberately, after the denylist version failed.
          #
          # That version enumerated the internal documents that existed when it
          # was written. Two created afterwards - the review plan and the org
          # migration runbook - sailed straight through it, and one of those
          # carries AWS account ids, OIDC subject claims and role names. A
          # denylist protects against the files you already thought of, which is
          # the wrong half: the dangerous file is the one nobody has written yet.
          #
          # Adding a public document is a deliberate act and should cost one line
          # here. Copying an internal one in should fail.
          ALLOWED='^(README|PRIVACY|CHANGELOG|LICENSE|CONTRIBUTING|SECURITY|CODE_OF_CONDUCT)\.md$'

          BAD=$(git ls-files '*.md' | grep -vE "$ALLOWED" || true)
          if [ -n "$BAD" ]; then
            echo "::error::Markdown file(s) not on the public allowlist:"
            echo "$BAD"
            echo ""
            echo "This repository is public. Internal planning documents belong in the"
            echo "private repository. If this file really is meant to be public, add its"
            echo "name to ALLOWED in this workflow - deliberately, in its own commit."
            exit 1
          fi
          echo "OK - every markdown file is on the public allowlist"

      - name: Refuse references to the private repository
        run: |
          set -euo pipefail

          # The bracket around [D] is deliberate and load-bearing. The private
          # repository's path differs from this project's MCP Registry namespace
          # only by the capital D, so the match must stay case-sensitive - and
          # writing the path literally here would make this file match itself,
          # which is exactly how the first version of this check failed. The
          # bracket keeps the pattern from matching its own text without needing
          # a path exclusion, and an exclusion would be a hole to hide in.
          HITS=$(git grep -nE 'cogdepot/cog[D]epot' -- . || true)

          if [ -n "$HITS" ]; then
            echo "::error::Reference to the private repository found."
            echo "$HITS"
            exit 1
          fi
          echo "OK - no references to the private repository"
