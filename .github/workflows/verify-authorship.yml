name: verify-authorship

# Commit identity is a project invariant: this repository becomes public at the
# first release, and commit history is permanent once it does. GitHub's
# commit_author_email_pattern ruleset would enforce this at push time, but that
# rule type is Enterprise-only and is silently a no-op on the Team plan - it
# reports enforcement: active and lets non-matching commits through. Verified
# 2026-08-09. This check is the enforceable substitute, wired as a required
# status check so a non-compliant commit cannot merge.

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  authorship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Every commit must carry the project identity
        env:
          EXPECTED: akashy@cogdepot.com
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          # Choosing the range is the whole correctness of this check, and the
          # first version got it wrong in a way that could have caused real
          # damage. github.event.before is all-zeros for a new branch and points
          # at a vanished commit after any force-push, so the original fallback
          # was RANGE="$HEAD_SHA" - everything reachable. That fails closed,
          # which was the right instinct, but it scans history from before this
          # rule existed.
          #
          # On 2026-08-22 it did exactly that: a force-push correcting one
          # commit's author left BASE_SHA unreachable, so it walked back and
          # reported de0fc89 from 2026-08-18 - already on main, under the v0.2.x
          # and v0.3.0 tags. Following this job's own instruction to rewrite it
          # would have moved every SHA from that date forward, broken the release
          # tags, and invalidated the npm provenance attestations that tie
          # published packages to specific commits. A guard that cannot tell a new
          # violation from released history will eventually be obeyed by somebody
          # who does the destructive thing.
          #
          # So the fallback is origin/main..HEAD: commits not yet released. That
          # is the set this rule can actually ask anyone to fix, because history
          # already on main is immutable in practice - the tags and the provenance
          # trail depend on those exact SHAs. Still fails closed: if neither a
          # usable base nor origin/main exists, the job errors rather than
          # guessing at a range.
          if [ -n "${BASE_SHA:-}" ] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            RANGE="${BASE_SHA}..${HEAD_SHA}"
          elif git rev-parse --verify --quiet origin/main >/dev/null; then
            RANGE="origin/main..${HEAD_SHA}"
            echo "::warning::BASE_SHA unusable (new branch or force-push); checking unreleased commits only ($RANGE)"
          else
            echo "::error::Cannot determine a commit range: BASE_SHA is unusable and origin/main is absent."
            echo "Refusing to guess. Re-run with full history, or push a commit so a valid base exists."
            exit 1
          fi

          echo "Checking $RANGE"

          # Content commits must be the project identity, with no exceptions.
          BAD=$(git log --no-merges --format='%H %ae %ce' "$RANGE" \
                | awk -v want="$EXPECTED" '$2 != want || $3 != want')

          if [ -n "$BAD" ]; then
            echo "::error::Commits do not carry the project identity ($EXPECTED)."
            echo "Offending commits (sha author-email committer-email):"
            echo "$BAD"
            echo ""
            echo "Fix your clone, then rewrite the offending commits:"
            echo "  git config --local user.name akashy"
            echo "  git config --local user.email $EXPECTED"
            exit 1
          fi

          # Merge commits are a different case, and the first version of this
          # check got it wrong: a release promotion is performed by the
          # cogdepot-bot App, so GitHub creates the merge commit authored by the
          # bot and committed by its own web-flow identity. Neither is the
          # project identity, so requiring it here failed every promotion - and
          # failed it *after* the merge, where nothing gates it, because the
          # merge commit does not exist while the PR is being checked.
          #
          # Merge commits carry no content of their own; their parents are
          # checked above. So allow the release identities here and nowhere else.
          BAD_MERGE=$(git log --merges --format='%H %ae %ce' "$RANGE" | awk -v want="$EXPECTED" '
            function allowed(email) {
              return email == want \
                  || index(email, "cogdepot-bot[bot]@users.noreply.github.com") > 0 \
                  || email == "noreply@github.com"
            }
            !allowed($2) || !allowed($3)')

          if [ -n "$BAD_MERGE" ]; then
            echo "::error::Merge commits must be made by the project identity or the release bot."
            echo "Offending merges (sha author-email committer-email):"
            echo "$BAD_MERGE"
            exit 1
          fi

          echo "OK - content commits in $RANGE are authored and committed by $EXPECTED"
          echo "OK - any merge commits are the project identity or the release bot"
