AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Metadata:
  cfn-lint:
    config:
      ignore_checks:
        # W1030 wants CertificateArn to look like an ACM ARN. Its default is
        # deliberately "" - the empty value IS the dormant-deploy switch, and the
        # parameter is only read under the HasCustomDomain condition, so an empty
        # default can never reach an ACM lookup. Without this the template lints
        # dirty purely for supporting a dormant deploy.
        - W1030
Description: >
  Remote MCP server for cogDepot - a Lambda behind an HTTP API on a custom
  domain. The Lambda runs the same createRemoteHandler() the stdio build wraps;
  only the transport differs. Deployed with `aws cloudformation package` +
  `deploy` from a pre-built esbuild bundle (npm run build:lambda), so no SAM CLI
  or in-pipeline build is required.

Parameters:
  Stage:
    Type: String
    AllowedValues: [staging, production]

  DomainName:
    Type: String
    Default: ""
    Description: >
      Custom domain for the MCP server, e.g. staging.mcp.cogdepot.com. Empty = a
      DORMANT deploy: no custom domain, no API mapping, no Route53 record, so the
      stack can be stood up in a new account while another account still owns the
      name. API Gateway custom domain names are globally unique per region, so a
      non-dormant deploy of a name another account holds fails outright - and would
      also repoint live DNS the moment it succeeded.

  CertificateArn:
    Type: String
    Default: ""
    Description: >
      ACM cert ARN for DomainName (us-east-1). From the foundation Terraform's
      mcp_certificate_arn output. Only read when DomainName is set; defaults empty so
      a dormant deploy does not have to invent one.

  HostedZoneId:
    Type: String
    Default: Z038731330GY98JQNZMZQ
    Description: >
      Route53 hosted zone for cogdepot.com - same zone the API stack uses. Was
      Z06203922NKB14MYQ8LL5, the zone in the old management account; cogdepot.com was
      re-delegated to the zone above during the account split, and the old zone is now
      orphaned (nothing delegates to it). Deploying against the old id would create
      records nobody resolves, so the name would silently never come up.

  ApiBaseUrl:
    Type: String
    Description: COGDEPOT_API_BASE_URL - the cogDepot API this stage relays to (https, cogdepot.com host only).

  OAuthIssuer:
    Type: String
    Default: ""
    Description: COGDEPOT_OAUTH_ISSUER - the Cognito user-pool issuer. Empty leaves the server on the Phase 1 static-header model.

  OAuthClientId:
    Type: String
    Default: ""
    Description: COGDEPOT_OAUTH_CLIENT_ID - the agent app-client id tokens are bound to.

  OAuthResource:
    Type: String
    Default: ""
    Description: COGDEPOT_OAUTH_RESOURCE - this server's resource identifier, which must equal the URL a user enters in the connector.

  OAuthScopes:
    Type: String
    Default: ""
    Description: COGDEPOT_OAUTH_SCOPES - space-separated advertised scopes, e.g. "cogdepot/read cogdepot/trade:negotiate cogdepot/trade:finalize".

Globals:
  Function:
    # nodejs22.x, not 20: node20 reached Lambda EOL 2026-04-30. The esbuild bundle
    # is plain ESM over the bundled AWS SDK v3 (no native addons), so it runs on 22
    # unchanged - the runtime bump needs no code change. The live staging function
    # in the mgmt account is intentionally left on its old runtime until the account
    # split redeploys it from this template; this value is what that redeploy lands.
    Runtime: nodejs22.x
    Architectures: [arm64]
    MemorySize: 256
    # A cold start reads no secrets and makes no network call until the first
    # token verification, so this is generous; the 10s OAuth-endpoint budget the
    # connector allows is the tighter constraint, met by keeping the handler warm.
    Timeout: 30

Conditions:
  # Empty DomainName => dormant deploy (no domain, no mapping, no Route53).
  HasCustomDomain: !Not [!Equals [!Ref DomainName, ""]]

  # Retention differs by stage: staging carries connector smoke traffic with no
  # forensic value, production is the agent-facing front door.
  IsProduction: !Equals [!Ref Stage, production]

Resources:
  McpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      # J3 (cogDepot docs/security-review-plan.md). The MCP surface is the
      # agent-facing front door and was the last API in the estate with no access
      # log: the Lambda records what it chooses to record, which by definition
      # excludes every request rejected BEFORE it reached the handler - an
      # unauthenticated probe, a bad OAuth token, a malformed envelope. Those are
      # exactly the requests a security review needs and could not get.
      #
      # Format is byte-identical to the cogDepot API and storefront settings so a
      # single CloudWatch Insights query reads all three. The query string is
      # deliberately absent: an OAuth code or token can ride there, and a
      # credential in a log is a credential leaked.
      AccessLogSettings:
        DestinationArn: !GetAtt McpAccessLogGroup.Arn
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","requestTime":"$context.requestTime","httpMethod":"$context.httpMethod","routeKey":"$context.routeKey","path":"$context.path","status":"$context.status","protocol":"$context.protocol","responseLength":"$context.responseLength","responseLatency":"$context.responseLatency","userAgent":"$context.identity.userAgent","integrationStatus":"$context.integrationStatus","integrationError":"$context.integrationErrorMessage"}'

  # Declared explicitly. Unlike /aws/lambda/<fn>, which Lambda creates on first
  # invoke, nothing creates an API Gateway access-log group but this - and if it
  # is absent, delivery fails SILENTLY, which is the failure mode this resource
  # exists to prevent.
  #
  # No CloudWatch Logs resource policy is needed: an HTTP API (v2) writes access
  # logs without one. Verified 2026-09-05 against the cogDepot storefront's own
  # HTTP API, which has logged since 2026-08-17 with zero resource policies in
  # the account. (A sibling change briefly added one on the opposite assumption
  # and was reverted - do not re-add it.)
  McpAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/apigateway/cogdepot-mcp-${Stage}
      RetentionInDays: !If [IsProduction, 90, 30]

  # The custom domain, its ACM mapping and the Route53 alias were a SAM `Domain:`
  # block on McpApi. They are spelled out as raw resources so each can carry a
  # Condition: SAM evaluates `Domain` at transform time and rejects an !If there
  # ("Custom Domains only works if both DomainName and CertificateArn are
  # provided"), so the sugar cannot express a dormant deploy. Same shape as the
  # cogDepot API stack's ApiDomainName/ApiDomainMapping/ApiDomainRecord.
  McpDomainName:
    Type: AWS::ApiGatewayV2::DomainName
    Condition: HasCustomDomain
    Properties:
      DomainName: !Ref DomainName
      DomainNameConfigurations:
        - CertificateArn: !Ref CertificateArn
          EndpointType: REGIONAL

  McpApiMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    Condition: HasCustomDomain
    # Stage is the literal "$default", not a !Ref, so CloudFormation sees no
    # dependency on the SAM-generated default stage and would create the mapping in
    # parallel with it. On a from-scratch create the mapping can win that race and
    # fail "Invalid stage identifier" - hit for real on the cogDepot API stack's
    # 3.11 staging create (fixed there in 9a5b837). Force the order.
    DependsOn: McpApiApiGatewayDefaultStage
    Properties:
      ApiId: !Ref McpApi
      DomainName: !Ref McpDomainName
      Stage: $default

  McpDomainRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasCustomDomain
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "${DomainName}."
      Type: A
      AliasTarget:
        DNSName: !GetAtt McpDomainName.RegionalDomainName
        HostedZoneId: !GetAtt McpDomainName.RegionalHostedZoneId

  McpFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub cogdepot-mcp-${Stage}
      CodeUri: ../../lambda-dist
      Handler: index.handler
      Environment:
        Variables:
          COGDEPOT_API_BASE_URL: !Ref ApiBaseUrl
          # All four empty by default -> the remote server stays on the Phase 1
          # static-header path (resolveOAuthConfig returns undefined). Set together
          # to turn on the OAuth gate; a half-set config fails the cold start.
          COGDEPOT_OAUTH_ISSUER: !Ref OAuthIssuer
          COGDEPOT_OAUTH_CLIENT_ID: !Ref OAuthClientId
          COGDEPOT_OAUTH_RESOURCE: !Ref OAuthResource
          COGDEPOT_OAUTH_SCOPES: !Ref OAuthScopes
      Events:
        Root:
          Type: HttpApi
          Properties:
            ApiId: !Ref McpApi
            Path: /
            Method: ANY
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref McpApi
            Path: /{proxy+}
            Method: ANY

Outputs:
  McpUrl:
    Description: >
      The MCP server URL. With a custom domain this is what a user enters as the
      custom connector; on a dormant deploy it falls back to the execute-api URL, which
      is the only way to reach the stack before the name is attached. Without the
      fallback this output is the bare string "https://".
    Value: !If
      - HasCustomDomain
      - !Sub https://${DomainName}
      - !Sub https://${McpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
  FunctionName:
    Value: !Ref McpFunction
